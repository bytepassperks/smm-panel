# SMM Panel - Nginx Configuration
# Production-ready with security headers and PHP-FPM

# =====================================================
# Worker Configuration
# =====================================================
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# =====================================================
# HTTP Configuration
# =====================================================
http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting (optional - uncomment if needed)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # =====================================================
    # PHP-FPM Upstream
    # =====================================================
    upstream php {
        server 127.0.0.1:9000;
    }

    # =====================================================
    # Main Server Block
    # =====================================================
    server {
        listen 10000;
        listen [::]:10000;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        # Security: Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Security: Deny access to sensitive files
        location ~ /\.(env|git|sql|md|log)$ {
            deny all;
        }

        # Security: Protect uploads directory
        location ^~ /uploads/ {
            deny all;
        }

        # Security: Protect configuration files
        location ~ /\.(env|json)$ {
            deny all;
        }

        # =====================================================
        # Static Files (CSS, JS, Images)
        # =====================================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # =====================================================
        # Favicon
        # =====================================================
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        # =====================================================
        # Robots.txt
        # =====================================================
        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # =====================================================
        # Main PHP Processing
        # =====================================================
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php;
            fastcgi_index index.php;

            # FastCGI Parameters
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # PHP Configuration
            fastcgi_param PHP_VALUE "upload_max_filesize=20M\npost_max_size=25M\nmemory_limit=256M";

            # Security: Don't pass sensitive headers
            fastcgi_hide_header X-Powered-By;

            # Timeouts
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;

            # Buffering
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;

            # Rate limiting (uncomment to enable)
            # limit_req zone=api_limit burst=20 nodelay;
        }

        # =====================================================
        # PHP-FPM Status Page (Disable in production)
        # =====================================================
        # location ~ ^/(php-fpm|status)$ {
        #     allow 127.0.0.1;
        #     deny all;
        #     fastcgi_pass php;
        #     include fastcgi_params;
        #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # }

        # =====================================================
        # Rewrite Rules for Clean URLs
        # =====================================================
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # =====================================================
        # Error Pages
        # =====================================================
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /var/www/html;
        }

        location = /403.html {
            root /var/www/html;
        }

        location = /404.html {
            root /var/www/html;
        }
    }
}